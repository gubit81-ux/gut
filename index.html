<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181818">
<title>new.html - HTML Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-ocean.min.css">
<style>
        /* ============================================================
           1. DESIGN TOKENS
           Central colors, sizes, and easing for the whole app.
        ============================================================ */
        :root {
            --bg-titlebar: #181818;
            --bg-editor: #1f1f1f;
            --border: #2b2b2b;
            --text: #cccccc;
            --text-muted: #9d9d9d;
            --text-faint: #6e6e6e;
            --accent: #0078d4;
            --accent-hover: #0090ff;
            --success: #4ec9b0;
            --radius: 4px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            color-scheme: dark;
        }

        /* ============================================================
           2. BASE RESET — prevents layout shift, locks app to viewport
        ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: var(--bg-editor);
            color: var(--text);
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 1px solid var(--accent);
            outline-offset: -1px;
        }

        /* ============================================================
           3. HEADER — titlebar, tabs, breadcrumbs
        ============================================================ */
        .header {
            flex: 0 0 auto;
            background: var(--bg-titlebar);
            border-bottom: 1px solid var(--border);
            contain: content;
        }

        .titlebar {
            height: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            font-size: 12px;
            color: var(--text-muted);
            user-select: none;
        }

        .titlebar nav {
            display: flex;
            gap: 14px;
            white-space: nowrap;
            overflow: hidden;
        }

        .tab-strip {
            height: 35px;
            display: flex;
            background: var(--bg-titlebar);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tab-strip::-webkit-scrollbar {
            display: none;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            font-size: 13px;
            background: var(--bg-editor);
            color: var(--text);
            border-right: 1px solid var(--border);
            border-top: 1px solid var(--accent);
            white-space: nowrap;
        }

        .icon {
            width: 14px;
            height: 14px;
            fill: var(--text-muted);
            display: block;
        }

        .icon-btn {
            background: none;
            border: 0;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .icon-btn:hover .icon {
            fill: #ffffff;
        }

        .breadcrumb-bar {
            height: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            background: var(--bg-editor);
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
        }

        .actions-right {
            display: flex;
            gap: 2px;
        }

        .actions-right .icon {
            width: 16px;
            height: 16px;
        }

        #runButton .icon {
            fill: var(--success);
        }
        /* ============================================================
           4. WORKSPACE + CODEMIRROR — fluid, fills viewport
        ============================================================ */
        .workspace {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            isolation: isolate;
        }

        .editor-wrap {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
            background: var(--bg-editor);
        }

        .CodeMirror {
            position: absolute !important;
            inset: 0;
            height: 100% !important;
            font-family: "Cascadia Code", Consolas, monospace !important;
            font-size: 14px !important;
            line-height: 1.6 !important;
        }

        .CodeMirror-gutters {
            background: var(--bg-editor) !important;
            border-right: 1px solid var(--border) !important;
        }

        .CodeMirror-linenumber {
            color: var(--text-faint) !important;
        }

        .CodeMirror-cursor {
            border-left: 2px solid var(--accent-hover) !important;
        }

        .CodeMirror-selected {
            background: rgba(0, 120, 212, 0.28) !important;
        }

        /* ============================================================
           5. FULLSCREEN VIDEO PREVIEW — GPU slide, lockdown mode
           Hidden Close button until video 'ended' event fires.
        ============================================================ */
        .preview-panel {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: #000000;
            z-index: 99999;
            display: flex;
            visibility: hidden;
            pointer-events: none;
            transform: translate3d(100%, 0, 0);
            transition: transform 0.32s var(--ease), visibility 0s 0.32s;
            will-change: transform;
            contain: strict;
        }

        .preview-panel.is-open {
            transform: none;
            visibility: visible;
            pointer-events: auto;
            transition: transform 0.32s var(--ease);
        }

        .preview-panel.is-closing {
            transform: translate3d(100%, 0, 0);
        }

        .video-container {
            flex: 1;
            min-height: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            overflow: hidden;
            position: relative;
        }

        video.preview-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            background: #000000;
            outline: none;
        }

        .btn-close {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            background: #d13438;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-weight: 600;
            padding: 9px 20px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            z-index: 100000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateY(-6px);
            pointer-events: none;
            transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
        }

        .btn-close.show {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        .btn-close:hover {
            background: #e5484d;
        }
        /* ============================================================
           6. SNIPPET TOOLBAR (bottom bar)
        ============================================================ */
        .snippet-footer {
            flex: 0 0 auto;
            min-height: 48px;
            display: flex;
            background: var(--bg-titlebar);
            border-top: 1px solid var(--border);
            padding: 6px 12px;
            align-items: center;
            z-index: 10;
            contain: content;
        }

        .side-indicator {
            display: none;
        }

        .keyboard-toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            width: 100%;
            min-width: 0;
        }

        .toolbar-row {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
            scrollbar-width: none;
            min-width: 0;
        }

        .toolbar-row::-webkit-scrollbar {
            display: none;
        }

        .toolbar-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-right: 4px;
            letter-spacing: 0.6px;
            flex: 0 0 auto;
        }

        .snippet-btn {
            background: #2d2d2d;
            color: var(--text);
            border: 1px solid #3e3e3e;
            padding: 5px 11px;
            border-radius: var(--radius);
            font-size: 12px;
            font-family: Consolas, monospace;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .snippet-btn:hover {
            background: #3d3d3d;
            border-color: var(--accent);
        }

        .snippet-btn:active {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        /* ============================================================
           7. RESPONSIVE — tablet + mobile, no overlap
        ============================================================ */
        @media (max-width: 900px) {
            .titlebar nav span:nth-child(n + 6) {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .titlebar {
                padding: 0 8px;
            }

            .titlebar nav {
                gap: 10px;
            }

            .snippet-footer {
                padding: 0;
                align-items: stretch;
            }

            .side-indicator {
                display: flex;
                width: 26px;
                flex: 0 0 26px;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                font-size: 8px;
                color: var(--accent-hover);
                font-weight: 800;
                line-height: 12px;
                background: var(--bg-titlebar);
                border-right: 1px solid var(--border);
            }

            .keyboard-toolbar {
                flex-direction: column;
                padding: 6px;
            }

            .toolbar-row {
                width: 100%;
            }

            .toolbar-label {
                display: none;
            }

            .snippet-btn {
                min-width: 44px;
                height: 34px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 0 12px;
            }

            .CodeMirror {
                font-size: 13.5px !important;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .preview-panel,
            .btn-close,
            .snippet-btn {
                transition: none !important;
            }
        }
</style>
</head>
<body>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <div class="titlebar">
            <nav aria-label="Menu"><span>File</span><span>Edit</span><span>Selection</span><span>View</span><span>Go</span><span>Run</span><span>Terminal</span><span>Help</span></nav>
            <div style="display:flex;gap:10px">
                <svg class="icon" viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z" /></svg>
                <svg class="icon" viewBox="0 0 24 24"><path d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H6V6h12v12z" /></svg>
                <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" /></svg>
            </div>
        </div>

        <div class="tab-strip">
            <div class="tab" role="tab" aria-selected="true">
                <svg class="icon" viewBox="0 0 24 24" style="fill:#e44d26"><path d="M12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61z" /></svg>
                <span>new.html</span>
                <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" /></svg>
            </div>
        </div>

        <div class="breadcrumb-bar">
            <div style="display:flex;gap:6px;align-items:center">
                <svg class="icon" style="width:12px;height:12px" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" /></svg>
                <span>&gt; new.html</span>
            </div>
            <div class="actions-right">
                <button class="icon-btn" title="Search" aria-label="Search"><svg class="icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z" /></svg></button>
                <button class="icon-btn" title="Save" aria-label="Save"><svg class="icon" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10z" /></svg></button>
                <button class="icon-btn" id="runButton" title="Run Preview" aria-label="Run preview"><svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg></button>
                <button class="icon-btn" title="More options" aria-label="More options"><svg class="icon" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" /></svg></button>
            </div>
        </div>
    </header>

    <!-- ================= WORKSPACE ================= -->
    <main class="workspace">
        <div class="editor-wrap">
            <textarea id="editorCode" aria-label="Code editor"></textarea>
        </div>

        <!-- Fullscreen video preview (lockdown until playback ends) -->
        <section class="preview-panel" id="previewPanel" aria-hidden="true" aria-label="Video preview">
            <div class="video-container">
                <button class="btn-close" id="closeButton" aria-label="Close preview">Close</button>
                <video class="preview-video" id="previewVideo" playsinline preload="auto" disablepictureinpicture controlslist="nodownload">
                    <source id="videoSource" src="Ya.mp4" type="video/mp4">
                </video>
            </div>
        </section>
    </main>

    <!-- ================= SNIPPET TOOLBAR ================= -->
    <footer class="snippet-footer">
        <div class="side-indicator" aria-hidden="true">
            <span>H</span><span>M</span><span>T</span><span>L</span>
        </div>
        <div class="keyboard-toolbar">
            <div class="toolbar-row" id="snippetBar">
                <span class="toolbar-label">Snippets:</span>
            </div>
        </div>
    </footer>

    <!-- ================= LIBRARIES ================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    <!-- ================= APP LOGIC ================= -->
    <script>
        'use strict';

        /* ----------------------------------------------------------
           Module 1: Code Editor Setup
        ---------------------------------------------------------- */
        const codeEditor = CodeMirror.fromTextArea(
            document.getElementById('editorCode'),
            {
                mode: 'htmlmixed',
                theme: 'material-ocean',
                lineNumbers: true,
                indentUnit: 4,
                lineWrapping: true,
                viewportMargin: Infinity
            }
        );

        /* ----------------------------------------------------------
           Module 2: Snippet Toolbar (event delegation, no inline JS)
        ---------------------------------------------------------- */
        const SNIPPETS = [
            ['<div>', '<div></div>'],
            ['<a>', '<a></a>'],
            ['<img>', '<img src="">'],
            ['class', 'class=""'],
            ['id', 'id=""'],
            ['src', 'src=""'],
            ['indent', '\t'],
            ['=" "', '=" "'],
            ['<', '<'],
            ['>', '>'],
            ['</>', '</>'],
            ['<!--', '<!--  -->']
        ];

        const snippetBar = document.getElementById('snippetBar');

        SNIPPETS.forEach(function (item) {
            const button = document.createElement('button');
            button.className = 'snippet-btn';
            button.type = 'button';
            button.textContent = item[0];
            button.dataset.snippet = item[1];
            snippetBar.appendChild(button);
        });

        snippetBar.addEventListener('click', function (event) {
            const button = event.target.closest('.snippet-btn');
            if (!button) return;

            codeEditor.getDoc().replaceRange(
                button.dataset.snippet,
                codeEditor.getDoc().getCursor()
            );
            codeEditor.focus();
        });
        /* ----------------------------------------------------------
           Module 3: Random Video Preview with Lockdown
           - Picks randomly between Ya.mp4 and Yo.mp4
           - Covers 100% screen with object-fit: cover
           - Hides Close until video 'ended' event fires
        ---------------------------------------------------------- */
        const VIDEO_FILES = ['Ya.mp4', 'Yo.mp4', gr.mp4];

        const runButton = document.getElementById('runButton');
        const previewPanel = document.getElementById('previewPanel');
        const closeButton = document.getElementById('closeButton');
        const previewVideo = document.getElementById('previewVideo');
        const videoSource = document.getElementById('videoSource');

        let isLocked = false;

        // Preload both videos so random switch is instant.
        VIDEO_FILES.forEach(function (file) {
            const preloadLink = document.createElement('link');
            preloadLink.rel = 'preload';
            preloadLink.as = 'video';
            preloadLink.href = file;
            document.head.appendChild(preloadLink);
        });

        function pickRandomVideo() {
            const index = Math.floor(Math.random() * VIDEO_FILES.length);
            return VIDEO_FILES[index];
        }

        function setPreviewLocked(locked) {
            isLocked = locked;
            document.documentElement.style.overflow = locked ? 'hidden' : '';
        }

        function openPreview() {
            const chosenFile = pickRandomVideo();

            try {
                if (videoSource.getAttribute('src') !== chosenFile) {
                    videoSource.setAttribute('src', chosenFile);
                    previewVideo.load();
                } else {
                    previewVideo.currentTime = 0;
                }
            } catch (error) {
                // Ignore seek/load errors, still try to play.
            }

            previewPanel.classList.remove('is-closing');
            previewPanel.classList.add('is-open');
            previewPanel.setAttribute('aria-hidden', 'false');
            closeButton.classList.remove('show');
            setPreviewLocked(true);

            const playPromise = previewVideo.play();
            if (playPromise && playPromise.catch) {
                playPromise.catch(function () {
                    // If autoplay is blocked, allow manual close.
                    closeButton.classList.add('show');
                });
            }
        }

        function closePreview() {
            // Block closing while video is still playing.
            if (isLocked) return;

            previewPanel.classList.add('is-closing');
            previewPanel.setAttribute('aria-hidden', 'true');

            try {
                previewVideo.pause();
            } catch (error) {
                // Ignore.
            }

            window.setTimeout(function () {
                previewPanel.classList.remove('is-open', 'is-closing');
            }, 340);

            setPreviewLocked(false);
            codeEditor.focus();
        }

        runButton.addEventListener('click', openPreview);
        closeButton.addEventListener('click', closePreview);

        previewVideo.addEventListener('ended', function () {
            setPreviewLocked(false);
            closeButton.classList.add('show');
            closeButton.focus();
        });

        previewVideo.addEventListener('error', function () {
            setPreviewLocked(false);
            closeButton.classList.add('show');
        });

        // Lockdown guards: block Escape and right-click while open.
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && previewPanel.classList.contains('is-open')) {
                event.preventDefault();
            }
        });

        document.addEventListener('contextmenu', function (event) {
            if (previewPanel.classList.contains('is-open')) {
                event.preventDefault();
            }
        });

        /* ----------------------------------------------------------
           Module 4: Editor Defaults + Responsive Refresh
        ---------------------------------------------------------- */
        let resizeTimer = null;

        window.addEventListener('resize', function () {
            window.clearTimeout(resizeTimer);
            resizeTimer = window.setTimeout(function () {
                codeEditor.refresh();
            }, 120);
        });

        codeEditor.setValue(
            '<!DOCTYPE html>\n' +
            '<html lang="en">\n' +
            '<head>\n' +
            '    <meta charset="UTF-8">\n' +
            '    <title>New Project</title>\n' +
            '</head>\n' +
            '<body>\n' +
            '    <h1>Hello World!</h1>\n' +
            '</body>\n' +
            '</html>'
        );

        window.setTimeout(function () {
            codeEditor.refresh();
        }, 60);
    </script>
</body>
</html>
