<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeStudio Pro</title>
    
    <!-- CodeMirror & Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-ocean.min.css">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --accent-green: #10b981;
            --accent-blue: #38bdf8;
            --accent-red: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --header-height: 48px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow: hidden;
            position: fixed;
        }

        /* Header & Navigation */
        .editor-header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .tab-bar {
            display: flex;
            align-items: center;
            height: var(--header-height);
            padding-left: 12px;
            gap: 8px;
        }

        .folder-icon {
            color: var(--accent-blue);
            font-size: 16px;
            display: flex;
            align-items: center;
        }

        .tab {
            background-color: var(--bg-primary);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-bottom: none;
        }

        .tab-html-icon {
            color: var(--accent-red);
            font-weight: 700;
            font-size: 11px;
            background: rgba(244, 63, 94, 0.1);
            padding: 2px 4px;
            border-radius: 4px;
        }

        .close-tab {
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-tab:hover {
            color: var(--text-main);
        }

        /* Action Bar */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-muted);
        }

        .path-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .actions-right {
            display: flex;
            gap: 18px;
            font-size: 16px;
        }

        .actions-right span {
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .actions-right span:active {
            opacity: 0.7;
        }

        #runBtn {
            color: var(--accent-green);
        }

        /* Workspace & Editor */
        .workspace-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .CodeMirror {
            width: 100%;
            height: 100% !important;
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Preview Panel */
        .preview-panel {
            position: absolute;
            top: 0;
            left: 100%;
            width: 100%;
            height: 100%;
            background: #000000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(0);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .preview-panel.active {
            transform: translateX(-100%);
        }

        .preview-header {
            background-color: var(--bg-secondary);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }

        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
            padding: 12px;
        }

        .preview-video {
            max-width: 100%;
            max-height: 100%;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* Keyboard Toolbar */
        .toolbar-container {
            display: flex;
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .side-indicator {
            width: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            color: var(--accent-red);
            font-weight: 700;
            letter-spacing: 1px;
            background-color: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            user-select: none;
        }

        .keyboard-toolbar {
            flex: 1;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .toolbar-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .toolbar-row::-webkit-scrollbar {
            display: none;
        }

        .btn {
            background-color: var(--bg-tertiary);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-family: monospace;
            min-width: 44px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
            flex-shrink: 0;
        }

        .btn:active {
            transform: scale(0.96);
            background-color: #475569;
        }

        .btn-wide {
            min-width: 70px;
        }

        .btn-danger {
            background-color: var(--accent-red);
            border: none;
            color: white;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header class="editor-header">
        <div class="tab-bar">
            <span class="folder-icon">📁</span>
            <div class="tab">
                <span class="tab-html-icon">HTML</span>
                <span>new.html</span>
                <span class="close-tab" title="Close Tab">✕</span>
            </div>
        </div>
        
        <div class="action-bar">
            <div class="path-info">
                <span>📁</span> <span>/</span> <span>new.html</span>
            </div>
            <div class="actions-right">
                <span title="Search">🔍</span>
                <span title="Save">💾</span>
                <span id="runBtn" title="Run Project">▶</span>
                <span title="More Options">•••</span>
            </div>
        </div>
    </header>

    <main class="workspace-container">
        <textarea id="editorCode"></textarea>

        <section class="preview-panel" id="previewPanel" aria-hidden="true">
            <div class="preview-header">
                <span id="previewTitle">Live Preview</span>
                <button class="btn btn-danger" id="closePreviewBtn" style="display: none;">Close</button>
            </div>
            <div class="video-container">
                <video class="preview-video" id="liveVideo" controls playsinline preload="metadata">
                    <source src="Ya.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </section>
    </main>

    <nav class="toolbar-container" aria-label="Quick Code Toolbar">
        <div class="side-indicator">
            <span>H</span><span>T</span><span>M</span><span>L</span>
        </div>
        <div class="keyboard-toolbar">
            <div class="toolbar-row">
                <button class="btn btn-wide" onclick="insertSnippet('&lt;div&gt;&lt;/div&gt;')">&lt;div&gt;</button>
                <button class="btn" onclick="insertSnippet('&lt;a href=&quot;&quot;&gt;&lt;/a&gt;')">&lt;a&gt;</button>
                <button class="btn btn-wide" onclick="insertSnippet('&lt;img src=&quot;&quot; alt=&quot;&quot;&gt;')">&lt;img&gt;</button>
                <button class="btn btn-wide" onclick="insertSnippet('class=&quot;&quot;')">class</button>
                <button class="btn" onclick="insertSnippet('id=&quot;&quot;')">id</button>
                <button class="btn btn-wide" onclick="insertSnippet('src=&quot;&quot;')">src</button>
            </div>
            <div class="toolbar-row">
                <button class="btn" onclick="insertSnippet('\t')">⇥</button>
                <button class="btn btn-wide" onclick="insertSnippet('=&quot;&quot;')">=" "</button>
                <button class="btn" onclick="insertSnippet('&lt;')">&lt;</button>
                <button class="btn" onclick="insertSnippet('&gt;')">&gt;</button>
                <button class="btn" onclick="insertSnippet('&lt;/&gt;')">&lt;/&gt;</button>
                <button class="btn" onclick="insertSnippet('-')">-</button>
                <button class="btn btn-wide" onclick="insertSnippet('&lt;!--  --&gt;')">&lt;!-- --&gt;</button>
            </div>
        </div>
    </nav>

    <!-- CodeMirror Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <script>
        // Initialize CodeMirror Editor
        const editorInstance = CodeMirror.fromTextArea(document.getElementById('editorCode'), {
            mode: "htmlmixed",
            theme: "material-ocean",
            lineNumbers: true,
            indentUnit: 4,
            smartIndent: true,
            lineWrapping: true
        });

        function insertSnippet(val) {
            const doc = editorInstance.getDoc();
            const cursor = doc.getCursor();
            doc.replaceRange(val, cursor);
            editorInstance.focus();
        }

        // DOM Elements
        const runBtn = document.getElementById('runBtn');
        const previewPanel = document.getElementById('previewPanel');
        const closePreviewBtn = document.getElementById('closePreviewBtn');
        const liveVideo = document.getElementById('liveVideo');

        // Event Listeners
        runBtn.addEventListener('click', () => {
            previewPanel.classList.add('active');
            previewPanel.setAttribute('aria-hidden', 'false');
            closePreviewBtn.style.display = 'none';
            
            liveVideo.currentTime = 0;
            liveVideo.play().catch(err => console.log("Autoplay blocked:", err));
        });

        liveVideo.addEventListener('ended', () => {
            closePreviewBtn.style.display = 'block';
        });

        closePreviewBtn.addEventListener('click', () => {
            previewPanel.classList.remove('active');
            previewPanel.setAttribute('aria-hidden', 'true');
        });

        // Initial Boilerplate Content
        editorInstance.setValue(`<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Project</title>
</head>
<body>
    <h1>Hello World!</h1>
</body>
</html>`);
    </script>
</body>
</html>
