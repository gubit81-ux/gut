<style>
:root{--t:#181818;--e:#1f1f1f;--b:#2b2b2b;--tx:#ccc;--mut:#9d9d9d;--fnt:#6e6e6e;--ac:#0078d4;--ah:#0090ff;--ok:#4ec9b0;--r:4px;--ez:cubic-bezier(.4,0,.2,1);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100dvh;width:100vw;overflow:hidden;overscroll-behavior:none}
body{background:var(--e);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}:focus-visible{outline:1px solid var(--ac);outline-offset:-1px}

.tb nav{display:flex;gap:14px;white-space:nowrap;overflow:hidden}

.ic{width:14px;height:14px;fill:var(--mut);display:block}

.ib:hover{background:rgba(255,255,255,.08)}.ib:hover .ic{fill:#fff}

.ar{display:flex;gap:2px}.ar .ic{width:16px;height:16px}
#runBtn .ic{fill:var(--ok)}
.ws{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative;isolation:isolate}
.ew{flex:1 1 auto;min-height:0;position:relative;background:var(--e)}
.CodeMirror{position:absolute!important;inset:0;height:100%!important;font-family:"Cascadia Code",Consolas,monospace!important;font-size:14px!important;line-height:1.6!important}
.CodeMirror-gutters{background:var(--e)!important;border-right:1px solid var(--b)!important}
.CodeMirror-linenumber{color:var(--fnt)!important}
.CodeMirror-cursor{border-left:2px solid var(--ah)!important}
.CodeMirror-selected{background:rgba(0,120,212,.28)!important}
.pv{position:fixed;inset:0;width:100vw;height:100dvh;background:#000;z-index:99999;display:flex;visibility:hidden;pointer-events:none;transform:translate3d(100%,0,0);transition:transform .32s var(--ez),visibility 0s .32s;will-change:transform;contain:strict}
.pv.on{transform:none;visibility:visible;pointer-events:auto;transition:transform .32s var(--ez)}
.pv.off{transform:translate3d(100%,0,0)}
.vc{flex:1;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;position:relative}
video.pvv{width:100%;height:100%;object-fit:cover;object-position:center;background:#000;outline:none}
.bc{position:absolute;top:max(20px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));background:#d13438;border:1px solid rgba(255,255,255,.15);color:#fff;font-weight:600;padding:9px 20px;border-radius:var(--r);cursor:pointer;font-size:14px;z-index:100000;box-shadow:0 4px 16px rgba(0,0,0,.6);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .25s var(--ez),transform .25s var(--ez)}
.bc.show{opacity:1;transform:none;pointer-events:auto}.bc:hover{background:#e5484d}
.ft{flex:0 0 auto;min-height:48px;display:flex;background:var(--t);border-top:1px solid var(--b);padding:6px 12px;align-items:center;z-index:10;contain:content}
.si{display:none}
.kt{display:flex;gap:6px;flex-wrap:wrap;width:100%;min-width:0}
.tr{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;min-width:0}
.tr::-webkit-scrollbar{display:none}
.lb{font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:600;margin-right:4px;letter-spacing:.6px;flex:0 0 auto}
.bn{background:#2d2d2d;color:var(--tx);border:1px solid #3e3e3e;padding:5px 11px;border-radius:var(--r);font-size:12px;font-family:Consolas,monospace;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap;flex:0 0 auto}
.bn:hover{background:#3d3d3d;border-color:var(--ac)}
.bn:active{background:var(--ac);border-color:var(--ac);color:#fff}
@media(max-width:900px){.tb nav span:nth-child(n+6){display:none}}
@media(max-width:768px){.tb{padding:0 8px}.tb nav{gap:10px}.ft{padding:0;align-items:stretch}.si{display:flex;width:26px;flex:0 0 26px;flex-direction:column;justify-content:center;align-items:center;font-size:8px;color:var(--ah);font-weight:800;line-height:12px;background:var(--t);border-right:1px solid var(--b)}.kt{flex-direction:column;padding:6px}.tr{width:100%}.lb{display:none}.bn{min-width:44px;height:34px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px}.CodeMirror{font-size:13.5px!important}}
@media(prefers-reduced-motion:reduce){.pv,.bc,.bn{transition:none!important}}
</style>
</head>

<script>
(function(){var ed=CodeMirror.fromTextArea(document.getElementById('ed'),{mode:'htmlmixed',theme:'material-ocean',lineNumbers:true,indentUnit:4,lineWrapping:true,viewportMargin:Infinity});
var SN=[['<div>','<div></div>'],['<a>','<a></a>'],['<img>','<img src="">'],['class','class=""'],['id','id=""'],['src','src=""'],['ind','\t'],['=" "','=" "'],['<','<'],['>','>'],['</>','</>'],['<!--','<!--  -->']];
var bar=document.getElementById('snip');
SN.forEach(function(s){var b=document.createElement('button');b.className='bn';b.textContent=s[0];b.dataset.v=s[1];bar.appendChild(b)});
bar.addEventListener('click',function(e){var b=e.target.closest('.bn');if(!b)return;ed.getDoc().replaceRange(b.dataset.v,ed.getDoc().getCursor());ed.focus()});
var run=document.getElementById('runBtn'),pv=document.getElementById('pv'),bc=document.getElementById('bc'),lv=document.getElementById('lv'),locked=false;
function lock(on){locked=on;document.documentElement.style.overflow=on?'hidden':''}
function openPV(){pv.classList.remove('off');pv.classList.add('on');pv.setAttribute('aria-hidden','false');bc.classList.remove('show');lock(true);try{lv.currentTime=0}catch(e){}var p=lv.play();if(p&&p.catch)p.catch(function(){bc.classList.add('show')})}
function closePV(){if(locked)return;pv.classList.add('off');pv.setAttribute('aria-hidden','true');try{lv.pause()}catch(e){}setTimeout(function(){pv.classList.remove('on','off')},340);lock(false);ed.focus()}
run.addEventListener('click',openPV);
lv.addEventListener('ended',function(){lock(false);bc.classList.add('show');bc.focus()});
lv.addEventListener('error',function(){lock(false);bc.classList.add('show')});
bc.addEventListener('click',closePV);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&pv.classList.contains('on')){e.preventDefault()}});
document.addEventListener('contextmenu',function(e){if(pv.classList.contains('on'))e.preventDefault()});
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){ed.refresh()},120)});

})();</script>
